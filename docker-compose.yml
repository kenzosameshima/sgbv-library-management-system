# Local stack: PostgreSQL, a one-shot migration job, and the API.
# The defaults below are for local development only; set real secrets in the environment for anything else.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sgb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgb-local-password}
      POSTGRES_DB: sgb_mvp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgb -d sgb_mvp"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/db/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://sgb:${POSTGRES_PASSWORD:-sgb-local-password}@db:5432/sgb_mvp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://sgb:${POSTGRES_PASSWORD:-sgb-local-password}@db:5432/sgb_mvp
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-refresh-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
